<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jace Grissom — data engineer. New site under construction.">
    <title>Jace Grissom</title>
    <style>
        :root {
            --bg: #F6F6FF;
            --text: #16161d;
            --muted: #5c5c6b;
            --accent: #e06b88;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121218;
                --text: #ececf3;
                --muted: #a0a0b0;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px 16px;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
        }

        h1 {
            margin: 0 0 0.25rem;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            letter-spacing: -0.02em;
        }

        .tagline {
            margin: 0 0 2rem;
            color: var(--muted);
            font-size: 1.125rem;
        }

        .status {
            display: inline-block;
            margin-bottom: 2rem;
            padding: 0.35rem 0.9rem;
            border: 1px solid var(--accent);
            border-radius: 999px;
            color: var(--accent);
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .links {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .links a {
            padding: 0.6rem 1.4rem;
            border-radius: 8px;
            background: var(--text);
            color: var(--bg);
            font-weight: 600;
            text-decoration: none;
        }

        .links a:hover,
        .links a:focus-visible {
            background: var(--accent);
            color: #fff;
        }
    </style>
</head>

<body>
    <main>
        <h1>Jace Grissom</h1>
        <p class="tagline">Data Engineer · dbt · Snowflake · Terraform · GCP </p>
        <div class="status">Site under construction</div>
        <nav class="links" aria-label="Profiles">
            <a href="https://github.com/jagriss" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="https://www.linkedin.com/in/jacegrissom/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        </nav>
    </main>
</body>

</html>
